# Docveta with Docker: the web app, its database and text recognition.
#
#   curl -LO https://raw.githubusercontent.com/anand34577/docveta/main/deploy/docker-compose.yml
#   docker compose up -d
#
# Then open http://<this computer>:8080 and create your account. There is nothing to edit:
# the database password and the text recognition engines' tokens are generated on first
# start and kept in Docker volumes that only these containers can see.
#
# More engines (run the same command again with a profile):
#   docker compose --profile tesseract up -d      # Tesseract, 100+ languages
#   docker compose --profile npu-rockchip up -d   # Rockchip NPU boards (needs converted models)
#   docker compose --profile office up -d         # Word, Excel and PowerPoint documents (Gotenberg)
#
# Optional settings (port, public address, …) go in a .env file next to this one; see
# https://github.com/anand34577/docveta/blob/main/deploy/.env.example
#
# Building the images from this repository instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: docveta

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Creates a random database password on first start. An existing install that set
    # POSTGRES_PASSWORD in .env keeps using it (the database was created with it).
    entrypoint:
      - sh
      - -c
      - |
        f=/run/docveta-secrets/db_password
        if [ ! -s "$$f" ]; then
          if [ -n "$$LEGACY_POSTGRES_PASSWORD" ]; then printf %s "$$LEGACY_POSTGRES_PASSWORD" > "$$f"
          else head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"; fi
          chmod 644 "$$f"
        fi
        unset LEGACY_POSTGRES_PASSWORD
        exec docker-entrypoint.sh "$$@"
      - --
    # Modest settings that suit 4–16 GB boards; raise shared_buffers on bigger hosts.
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=16MB
               -c maintenance_work_mem=128MB -c max_connections=60 -c random_page_cost=1.1
    environment:
      POSTGRES_USER: docveta
      POSTGRES_DB: docveta
      POSTGRES_PASSWORD_FILE: /run/docveta-secrets/db_password
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ${DOCVETA_DB_DIR:-db}:/var/lib/postgresql/data
      - secrets:/run/docveta-secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docveta"]
      interval: 5s
      timeout: 5s
      retries: 20

  docveta:
    image: ghcr.io/anand34577/docveta:${DOCVETA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DOCVETA_PORT:-8080}:8080"
    environment:
      DOCVETA_DATABASE_URL: postgres://docveta@db:5432/docveta?sslmode=disable
      DOCVETA_DATABASE_PASSWORD_FILE: /run/docveta-secrets/db_password
      # Text recognition engines below fetch their own token with this key.
      DOCVETA_WORKER_ENROLL_KEY_FILE: /run/docveta-workers/enroll.key
      # Optional: generated on first start and saved in data/docveta.conf when empty.
      DOCVETA_SECRET_KEY: ${DOCVETA_SECRET_KEY:-}
      DOCVETA_BASE_URL: ${DOCVETA_BASE_URL:-http://localhost:8080}
      DOCVETA_TRUSTED_PROXIES: ${DOCVETA_TRUSTED_PROXIES:-}
      DOCVETA_MAX_UPLOAD_MB: ${DOCVETA_MAX_UPLOAD_MB:-500}
      DOCVETA_LOG_LEVEL: ${DOCVETA_LOG_LEVEL:-info}
      DOCVETA_ALLOW_LOCAL_TARGETS: ${DOCVETA_ALLOW_LOCAL_TARGETS:-false}
      # With the "office" profile this is http://gotenberg:3000 (set DOCVETA_GOTENBERG_URL in .env,
      # or enter the address in Administration → Documents).
      DOCVETA_GOTENBERG_URL: ${DOCVETA_GOTENBERG_URL:-}
    volumes:
      - ${DOCVETA_DATA_DIR:-data}:/data
      - secrets:/run/docveta-secrets:ro
      - workers:/run/docveta-workers

  # PaddleOCR on the CPU: reads scans and photos. On by default.
  worker-ocr:
    image: ghcr.io/anand34577/docveta-ocr:${DOCVETA_VERSION:-latest}
    restart: unless-stopped
    depends_on: [docveta]
    environment:
      DOCVETA_URL: http://docveta:8080
      DOCVETA_ENROLL_KEY_FILE: /run/docveta-workers/enroll.key
      DOCVETA_WORKER_NAME: ocr-1
      DOCVETA_WORKER_TOKEN: ${DOCVETA_OCR_WORKER_TOKEN:-} # older installs; empty = enroll
      DOCVETA_OCR_DEVICE: cpu
    volumes:
      - workers:/run/docveta-workers:ro

  worker-cpu:
    profiles: ["tesseract", "cpu-ocr"]
    image: ghcr.io/anand34577/docveta-worker-tesseract:${DOCVETA_VERSION:-latest}
    restart: unless-stopped
    depends_on: [docveta]
    environment:
      DOCVETA_URL: http://docveta:8080
      DOCVETA_ENROLL_KEY_FILE: /run/docveta-workers/enroll.key
      DOCVETA_WORKER_NAME: cpu-1
      DOCVETA_WORKER_TOKEN: ${DOCVETA_CPU_WORKER_TOKEN:-}
      DOCVETA_CONCURRENCY: ${DOCVETA_CPU_CONCURRENCY:-2}
    volumes:
      - workers:/run/docveta-workers:ro

  # Converts Word/Excel/PowerPoint/OpenDocument files to PDF so they can be previewed and searched.
  gotenberg:
    profiles: ["office"]
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  worker-npu:
    profiles: ["npu-rockchip", "npu"]
    image: ghcr.io/anand34577/docveta-worker-rknn:${DOCVETA_VERSION:-latest}
    restart: unless-stopped
    depends_on: [docveta]
    devices:
      - /dev/rknpu:/dev/rknpu
      - /dev/dri:/dev/dri
    environment:
      DOCVETA_URL: http://docveta:8080
      DOCVETA_ENROLL_KEY_FILE: /run/docveta-workers/enroll.key
      DOCVETA_WORKER_NAME: npu-1
      DOCVETA_WORKER_TOKEN: ${DOCVETA_NPU_WORKER_TOKEN:-}
    volumes:
      - workers:/run/docveta-workers:ro
      - ${DOCVETA_MODELS_DIR:-./models}:/app/models:ro

volumes:
  data:
  db:
  secrets:
  workers:
