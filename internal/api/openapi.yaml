      - documents
      description: Resumable uploads follow the tus 1.0.0 protocol (creation, termination, expiration).
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Problem'
      security: []
    post:
      summary: 'tus: start a resumable upload'
      tags:
      - documents
      description: 'Metadata keys (base64 values): space_id, filename, title, tag_ids, correspondent_id, document_type_id,
        document_date, language, allow_duplicate, source.'
      responses:
        '201':
          description: Created; the Location header is the upload URL
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: Tus-Resumable
        in: header
        schema:
          type: string
        required: true
      - name: Upload-Length
        in: header
        schema:
          type: integer
        required: true
      - name: Upload-Metadata
        in: header
        schema:
          type: string
