components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-docveta_session
      description: Set by login/setup. Named `docveta_session` when the base URL is plain http.
    bearerToken:
      type: http
      scheme: bearer
      description: Personal access token (`dvt_pat_…`) created in Settings → API tokens.
    workerToken:
      type: http
      scheme: bearer
      description: Worker token (`dvt_wrk_…`) from Administration → Processing.
  responses:
    NoContent:
      description: Done
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ServerSettings:
      type: object
      properties:
        public_url:
          type: string
          description: Address used in links sent by email and push notifications
        allow_local_targets:
          type: boolean
          description: Everyone's notification channels and webhooks may reach the local network
        base_url:
          type: string
          readOnly: true
        base_url_fixed:
          type: boolean
          readOnly: true
          description: DOCVETA_BASE_URL names a real host, so it is used instead of public_url
        detected:
          type: string
          readOnly: true
        allow_local_env:
          type: boolean
          readOnly: true
    Identity:
      type: object
      properties:
        id:
          format: uuid
          type: string
        provider:
          type: string
          description: The issuer URL
        email:
          type: string
        created_at:
          format: date-time
          type: string
    APIToken:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        last_used_at:
          format: date-time
          nullable: true
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          items:
            type: string
          type: array
      required:
      - id
      - name
      - prefix
      - scopes
      - expires_at
      - last_used_at
      - created_at
      type: object
    AdminUserUpdate:
      properties:
        display_name:
          nullable: true
          type: string
        is_admin:
          nullable: true
          type: boolean
        password:
          nullable: true
          type: string
        status:
          nullable: true
          type: string
      type: object
    AuditEntry:
      properties:
        action:
          type: string
        actor_id:
          format: uuid
          nullable: true
          type: string
        actor_name:
          type: string
        actor_type:
          type: string
        at:
          format: date-time
          type: string
        details:
          additionalProperties:
            nullable: true
          type: object
        id:
          format: int64
          type: integer
        ip:
          type: string
        target_id:
          type: string
        target_type:
          type: string
        user_agent:
          type: string
      required:
      - id
      - at
      - actor_id
      - actor_name
      - actor_type
      - action
      - target_type
      - target_id
      - ip
      - user_agent
      - details
      type: object
    BulkInput:
      properties:
        action:
          type: string
          description: update, trash, restore, purge, reprocess, or suggest (ask the AI to suggest tags, type and sender again)
        select:
          type: string
          enum:
          - inbox
          - failed
          description: Pick the documents on the server instead of ids ("inbox" = your Inbox, "failed" = documents whose processing failed; up to 5000 per call)
        ids:
          items:
            format: uuid
            type: string
          type: array
        update:
          properties:
            add_tag_ids:
              items:
                format: uuid
                type: string
              type: array
            asn:
              format: int64
              type: integer
              nullable: true
            correspondent_id:
              format: uuid
              type: string
              nullable: true
            document_date:
              type: string
              nullable: true
            document_type_id:
              format: uuid
              type: string
              nullable: true
            inbox:
              type: boolean
              nullable: true
            language:
              type: string
              nullable: true
            physical_location:
              type: string
