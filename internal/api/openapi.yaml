      responses:
        '200':
          description: OK
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Tus-Resumable
        in: header
        schema:
          type: string
        required: true
    patch:
      summary: 'tus: send the next chunk'
      tags:
      - documents
      description: When the last chunk arrives the file becomes a document; its id is in the Docveta-Document-Id response
        header.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Tus-Resumable
        in: header
        schema:
          type: string
        required: true
      - name: Upload-Offset
        in: header
        schema:
          type: integer
        required: true
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
    delete:
      summary: 'tus: cancel an upload'
      tags:
      - documents
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Tus-Resumable
        in: header
        schema:
          type: string
        required: true
