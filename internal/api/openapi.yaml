      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - &id010
        name: lease_id
        in: query
        schema:
          type: string
          format: uuid
        description: Or the `Docveta-Lease` header
      security: *id009
  /worker/v1/tasks/{id}/ocr-result:
    get:
      summary: Download the OCR result (archive tasks)
      tags:
      - worker
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                nullable: true
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id010
      security: *id009
  /worker/v1/tasks/{id}/release:
    post:
      summary: Give a task back without failing it
      tags:
      - worker
      responses:
        '204': *id003
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lease_id
              properties:
                lease_id:
                  type: string
                  format: uuid
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: *id009
