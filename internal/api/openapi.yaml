# Docveta HTTP API (OpenAPI 3.0.3). Served at /api/v1/openapi.yaml.
# Keep in sync with internal/api: TestOpenAPIRoutes fails on any route mismatch.
openapi: 3.0.3
info:
  title: Docveta API
  version: '1'
  description: 'HTTP API of Docveta, a self-hosted document manager.


    Errors are RFC 9457 problem details (`application/problem+json`). Cookie-authenticated unsafe requests must be same-origin
    (CSRF protection); bearer tokens are exempt.


    This file is the contract: `go test ./internal/api` fails when a route is added or removed without updating it, and the
    integration test validates responses against it.'
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
security:
- sessionCookie: []
- bearerToken: []
tags:
- name: auth
- name: account
- name: documents
- name: spaces
- name: views
- name: sync
- name: taxonomy
- name: notifications
- name: admin
- name: worker
paths:
  /api/v1/admin/audit:
    get:
      summary: Audit log (newest first)
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        default: &id001
          $ref: '#/components/responses/Problem'
      parameters:
      - name: action
        in: query
        schema: &id002
          type: string
      - name: before
        in: query
        schema:
          type: integer
          format: int64
          description: Entry id to page before
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
  /api/v1/admin/settings/oidc:
    get:
      summary: Get oidc settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCConfig'
        default: *id001
    put:
      summary: Replace oidc settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCConfig'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCConfig'
  /api/v1/admin/settings/processing:
    get:
      summary: Get processing settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingSettings'
        default: *id001
    put:
      summary: Replace processing settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingSettings'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingSettings'
  /api/v1/admin/settings/smtp:
    get:
      summary: Get smtp settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMTPConfig'
        default: *id001
    put:
      summary: Replace smtp settings
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMTPConfig'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPConfig'
  /api/v1/admin/settings/smtp/test:
    post:
      summary: Send a test email to the admin
      tags:
      - admin
      responses:
        '204': &id003
          $ref: '#/components/responses/NoContent'
        default: *id001
  /api/v1/admin/system:
    get:
      summary: System information
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        default: *id001
  /api/v1/admin/tasks:
    get:
      summary: Processing tasks and queue stats
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - stats
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskView'
                  stats:
                    $ref: '#/components/schemas/QueueStats'
        default: *id001
      parameters:
      - name: status
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
  /api/v1/admin/tasks/{id}/retry:
    post:
      summary: Retry a failed task
      tags:
      - admin
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/admin/users:
    get:
      summary: List users
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        default: *id001
    post:
      summary: Create a user
      tags:
      - admin
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
  /api/v1/admin/users/{id}:
    patch:
      summary: Update a user
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete a user (their personal space must be empty)
      tags:
      - admin
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/admin/workers:
    get:
      summary: List OCR workers
      tags:
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Worker'
        default: *id001
    post:
      summary: Register a worker
      tags:
      - admin
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - worker
                - token
                properties:
                  worker:
                    $ref: '#/components/schemas/Worker'
                  token:
                    type: string
                    description: Shown once
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name: *id002
  /api/v1/admin/workers/{id}:
    patch:
      summary: Enable or disable a worker
      tags:
      - admin
      responses:
        '204': *id003
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled: &id007
                  type: boolean
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Remove a worker
      tags:
      - admin
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/admin/workers/{id}/rotate-token:
    post:
      summary: Issue a new worker token
      tags:
      - admin
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token: *id002
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/auth/login:
    post:
      summary: Sign in with email and password
      tags:
      - auth
      responses:
        '200':
          description: Signed in; a session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default: *id001
      description: Rate limited per IP and per IP+email; 429 responses carry `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email: *id002
                password: *id002
      security: &id004 []
  /api/v1/auth/logout:
    post:
      summary: Sign out (revokes the current session)
      tags:
      - auth
      responses:
        '204': *id003
        default: *id001
      security: *id004
  /api/v1/auth/oidc/callback:
    get:
      summary: Single sign-on callback
      tags:
      - auth
      responses:
        '303': &id005
          description: Redirect
        default: *id001
      parameters:
      - name: state
        in: query
        schema: *id002
      - name: code
        in: query
        schema: *id002
      - name: error
        in: query
        schema: *id002
      - name: error_description
        in: query
        schema: *id002
      security: *id004
  /api/v1/auth/oidc/start:
    get:
      summary: Start single sign-on
      tags:
      - auth
      responses:
        '303': *id005
        default: *id001
      parameters:
      - name: return_to
        in: query
        schema: *id002
      security: *id004
  /api/v1/changes:
    get:
      summary: Delta sync feed for offline clients
      tags:
      - sync
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        default: *id001
      parameters:
      - name: since
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 500
  /api/v1/correspondents:
    get:
      summary: List correspondents
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
          format: uuid
    post:
      summary: Create a correspondent
      tags:
      - taxonomy
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TaxonomyInput'
              - type: object
                required:
                - space_id
                properties:
                  space_id:
                    type: string
                    format: uuid
  /api/v1/correspondents/{id}:
    get:
      summary: Get a correspondent
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a correspondent
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete a correspondent
      tags:
      - taxonomy
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/correspondents/{id}/merge:
    post:
      summary: Merge other correspondents into this one
      tags:
      - taxonomy
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_ids
              properties:
                source_ids: &id006
                  type: array
                  items:
                    type: string
                    format: uuid
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/document-types:
    get:
      summary: List document types
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
          format: uuid
    post:
      summary: Create a document type
      tags:
      - taxonomy
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TaxonomyInput'
              - type: object
                required:
                - space_id
                properties:
                  space_id:
                    type: string
                    format: uuid
  /api/v1/document-types/{id}:
    get:
      summary: Get a document type
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a document type
      tags:
      - taxonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete a document type
      tags:
      - taxonomy
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/document-types/{id}/merge:
    post:
      summary: Merge other document types into this one
      tags:
      - taxonomy
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItem'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_ids
              properties:
                source_ids: *id006
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/documents:
    get:
      summary: List and search documents
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        default: *id001
      parameters:
      - name: q
        in: query
        schema: *id002
        description: Search query (supports `tag:`, `from:`, `type:`, `date:`, quotes and `-negation`)
      - name: sort
        in: query
        schema: *id002
      - name: cursor
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: total
        in: query
        schema: *id007
        description: Set to false to skip counting
      - name: space_id
        in: query
        schema: *id002
        description: Comma-separated ids; repeatable
      - name: tag_id
        in: query
        schema: *id002
        description: All of these tags
      - name: any_tag_id
        in: query
        schema: *id002
      - name: not_tag_id
        in: query
        schema: *id002
      - name: correspondent_id
        in: query
        schema: *id002
      - name: document_type_id
        in: query
        schema: *id002
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: added_from
        in: query
        schema: *id002
        description: RFC 3339 or YYYY-MM-DD
      - name: added_to
        in: query
        schema: *id002
      - name: inbox
        in: query
        schema: *id007
      - name: status
        in: query
        schema: *id002
        description: Comma-separated statuses
      - name: untagged
        in: query
        schema: *id007
      - name: no_correspondent
        in: query
        schema: *id007
      - name: no_document_type
        in: query
        schema: *id007
      - name: trash
        in: query
        schema: *id007
    post:
      summary: Upload a document
      tags:
      - documents
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default: *id001
      description: Metadata fields must come before the `file` part; the file is streamed to storage. 409 when the file is
        a duplicate (unless `allow_duplicate`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                space_id:
                  type: string
                  format: uuid
                  description: Defaults to the personal space
                title: *id002
                tag_ids:
                  type: string
                  description: Comma-separated
                correspondent_id:
                  type: string
                  format: uuid
                document_type_id:
                  type: string
                  format: uuid
                document_date:
                  type: string
                  format: date
                language: *id002
                allow_duplicate: *id007
                source:
                  type: string
                  enum:
                  - share
                  - scan
                file:
                  type: string
                  format: binary
                  description: Must be the last part
  /api/v1/documents/bulk:
    post:
      summary: Apply an action to many documents
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInput'
  /api/v1/documents/search:
    post:
      summary: Search with a JSON query
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
  /api/v1/documents/stats:
    get:
      summary: Counts for the home page
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        default: *id001
  /api/v1/documents/suggest:
    get:
      summary: Search-as-you-type suggestions
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        default: *id001
      parameters:
      - name: q
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
  /api/v1/documents/{id}:
    get:
      summary: Get a document
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          headers: &id008
            ETag:
              schema: *id002
              description: Document version, for If-Match
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update document metadata
      tags:
      - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          headers: *id008
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        schema: *id002
        description: Version from ETag; 412 if it changed
    delete:
      summary: Move to trash, or delete permanently
      tags:
      - documents
      responses:
        '204': *id003
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: permanent
        in: query
        schema: *id007
  /api/v1/documents/{id}/asn:
    post:
      summary: Assign the next archive serial number
      tags:
      - documents
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/documents/{id}/file:
    get:
      summary: Download a document file (supports Range)
      tags:
      - documents
      responses:
        '200':
          description: File content
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
