name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docveta
          POSTGRES_PASSWORD: docveta
          POSTGRES_DB: docveta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docveta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCVETA_TEST_DATABASE_URL: postgres://docveta:docveta@localhost:5432/docveta?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      # Includes the end-to-end integration test (it uses a throwaway schema).
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Cross-compile every release platform
        run: |
          for t in linux/amd64 linux/arm64 linux/arm linux/386 windows/amd64 windows/arm64 windows/386 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 go build -o /dev/null ./cmd/docveta || exit 1
          done
      - name: Zero-config start shows the database setup page
        run: |
          go build -o docveta ./cmd/docveta
          DOCVETA_DATA_DIR=$(mktemp -d) ./docveta serve &
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q "Connect a database"
          kill $!

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc -b && vite build
        working-directory: web

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "workers/sdk-python[heic,ppocr]" onnxruntime
      - run: python -m unittest discover -s tests
        working-directory: workers/sdk-python
      - run: python -m unittest test_onnx
        working-directory: workers/onnx
      - run: python -m unittest test_allwinner
        working-directory: workers/allwinner

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docveta:ci
          load: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docveta:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and compile the installer (without OCR)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force stage | Out-Null
          go build -o stage\docveta.exe .\cmd\docveta
          Copy-Item LICENSE, deploy\windows\README.txt -Destination stage
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=0.0.0-ci /DArch=x64 "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\out" deploy\windows\docveta.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed to compile" }
