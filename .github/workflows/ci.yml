name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docveta
          POSTGRES_PASSWORD: docveta
          POSTGRES_DB: docveta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docveta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCVETA_TEST_DATABASE_URL: postgres://docveta:docveta@localhost:5432/docveta?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      # Includes the end-to-end integration test (it uses a throwaway schema).
      - run: go test -race -timeout 30m ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Cross-compile every release platform
        run: |
          for t in linux/amd64 linux/arm64 linux/arm linux/386 windows/amd64 windows/arm64 windows/386 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 go build -o /dev/null ./cmd/docveta || exit 1
          done
      - name: Zero-config start, built-in database, clean stop
        run: |
          go build -o docveta ./cmd/docveta
          data=$(mktemp -d)
          DOCVETA_DATA_DIR=$data DOCVETA_LISTEN=127.0.0.1:18080 ./docveta serve &
          pid=$!
          for i in $(seq 30); do curl -sf localhost:18080/healthz && break; sleep 1; done
          curl -sf localhost:18080/ | grep -q 'id="kind-builtin"'
          curl -sf -X POST -d kind=builtin -d action=save localhost:18080/ | grep -q "Starting Docveta"
          for i in $(seq 60); do curl -sf -o /dev/null localhost:18080/api/v1/openapi.yaml && break; sleep 1; done
          curl -sf -o /dev/null localhost:18080/api/v1/openapi.yaml
          grep -q '^DOCVETA_DATABASE_URL=builtin$' $data/docveta.conf
          kill $pid; wait $pid || true
          ! pgrep -f "$data/postgres" # Docveta stopped its PostgreSQL
      # Downloads and runs PostgreSQL for the built-in database twice (start, restart).
      - run: go test -run Real -v ./internal/platform/builtindb/
        env:
          DOCVETA_TEST_BUILTIN: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc -b && vite build
        working-directory: web

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "workers/sdk-python[heic,ppocr]" onnxruntime
      - run: python -m unittest discover -s tests
        working-directory: workers/sdk-python
      - run: python -m unittest test_onnx
        working-directory: workers/onnx
      - run: python -m unittest test_allwinner
        working-directory: workers/allwinner

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docveta:ci
          load: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docveta:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # The Linux package's install.sh on a real init system: Debian (systemd) and Alpine (OpenRC).
  linux-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package
        run: |
          CGO_ENABLED=0 go build -o pkg/docveta ./cmd/docveta
          cp deploy/linux/install.sh deploy/linux/docveta.service pkg/
      - name: Debian with systemd
        run: |
          docker run -d --name deb --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD/pkg:/pkg:ro" jrei/systemd-debian:12
          sleep 8
          docker exec deb sh -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null 2>&1
            /pkg/install.sh
            for i in $(seq 30); do curl -sf -o /dev/null localhost:8080/healthz && break; sleep 1; done
            systemctl is-active docveta || { journalctl -u docveta --no-pager | tail -30; exit 1; }
            curl -sf -X POST -d kind=builtin -d action=save localhost:8080/ | grep -q "Starting Docveta"
            for i in $(seq 120); do curl -sf -o /dev/null localhost:8080/api/v1/openapi.yaml && exit 0; sleep 1; done
            journalctl -u docveta --no-pager | tail -30; exit 1'
      - name: Alpine with OpenRC
        run: |
          docker run -d --init --name alp -v "$PWD/pkg:/pkg:ro" alpine sleep infinity
          docker exec alp sh -c '
            apk add -q openrc curl >/dev/null
            mkdir -p /run/openrc && touch /run/openrc/softlevel
            /pkg/install.sh
            for i in $(seq 30); do curl -sf -o /dev/null localhost:8080/healthz && break; sleep 1; done
            curl -sf -X POST -d kind=builtin -d action=save localhost:8080/ | grep -q "Starting Docveta"
            for i in $(seq 120); do curl -sf -o /dev/null localhost:8080/api/v1/openapi.yaml && exit 0; sleep 1; done
            tail -30 /var/log/docveta.log; exit 1'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and compile the installer (without OCR)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force stage | Out-Null
          go build -o stage\docveta.exe .\cmd\docveta
          Copy-Item LICENSE, deploy\windows\README.txt -Destination stage
          # Bundle PostgreSQL like the release does, so the test covers the offline path.
          $pg = Get-Content internal\platform\builtindb\builtindb.go -Raw
          $pgv = [regex]::Match($pg, 'const Version = "([^"]+)"').Groups[1].Value
          $pgsum = [regex]::Match($pg, '"windows/amd64":\s*\{"windows-amd64", "([0-9a-f]{64})"').Groups[1].Value
          $jar = "embedded-postgres-binaries-windows-amd64-$pgv.jar"
          New-Item -ItemType Directory -Force stage\postgres | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "stage\postgres\$jar" "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-windows-amd64/$pgv/$jar"
          if ((Get-FileHash "stage\postgres\$jar" -Algorithm SHA256).Hash.ToLower() -ne $pgsum) { throw "PostgreSQL package checksum mismatch" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=0.0.0-ci /DArch=x64 "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\out" deploy\windows\docveta.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed to compile" }
      - name: Install as a service, set up the built-in database, restart, uninstall
        shell: pwsh
        run: |
          $log = 'C:\ProgramData\Docveta\logs\docveta.log'
          $pglog = 'C:\ProgramData\Docveta\postgres\postgres.log'
          # On failure, one annotation with the reason and the logs (annotations are public).
          function Fail($why) {
            $parts = @("$why", '--- service:', (Get-Service Docveta -ErrorAction SilentlyContinue | Out-String))
            $parts += '--- whoami:'; $parts += (whoami /groups | Select-String 'Mandatory Label|BUILTIN\Administrators' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(90, $_.Line.Length)) })
            $parts += '--- data folder:'; $parts += (cmd /c 'dir /s /b C:\ProgramData\Docveta 2>&1' | Select-Object -First 40)
            foreach ($f in $log, $pglog, "$env:ProgramFiles\Docveta\docveta.conf", "$env:ProgramFiles\Docveta\data\logs\docveta.log") { $parts += "--- $f"; $parts += (cmd /c "type `"$f`" 2>&1" | Select-Object -Last 25) }
            $parts += '--- postgres processes:'; $parts += (Get-Process postgres -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Id) $($_.Path)" })
            $parts += '--- listening:'; $parts += (netstat -ano | Select-String 'LISTENING' | Select-String ':8080 |127.0.0.1:' | ForEach-Object { $_.Line.Trim() } | Select-Object -First 10)
            $msg = ($parts -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=Windows service test::$msg"
            exit 1
          }
          function WaitFor($url, $pattern) {
            for ($i = 0; $i -lt 90; $i++) {
              try { $r = Invoke-WebRequest -UseBasicParsing $url -TimeoutSec 5; if ($r.StatusCode -eq 200 -and (-not $pattern -or [string]$r.Content -match $pattern)) { return $true } } catch {} # YAML arrives as bytes: check the status
              Start-Sleep 2
            }
            return $false
          }
          $setup = Get-ChildItem out\*.exe | Select-Object -First 1
          # Every step has a time limit, so a hang becomes an error with logs.
          $i = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $i.WaitForExit(300000)) { Fail 'installing hung' }
          if (-not (WaitFor http://localhost:8080/ 'kind-builtin')) { Fail 'the setup page did not appear' }
          # The service runs as SYSTEM, exactly as on users' computers.
          try { $r = Invoke-WebRequest -UseBasicParsing -Method Post http://localhost:8080/ -Body @{ kind = 'builtin'; action = 'save' } -TimeoutSec 600 }
          catch { Fail "setup request failed: $_" }
          if ($r.Content -notmatch 'Starting Docveta') { Fail ("built-in database setup failed: " + ([regex]::Match($r.Content, 'class="msg err"[^>]*>([^<]*)').Groups[1].Value)) }
          if (-not (WaitFor http://localhost:8080/api/v1/openapi.yaml '')) { Fail 'Docveta did not start on the built-in database' }
          if (-not (Select-String -Path $log -Pattern 'using the bundled PostgreSQL' -Quiet)) { Fail 'the bundled PostgreSQL was not used' }
          if (Test-Path "$env:ProgramFiles\Docveta\data") { Fail 'data was written next to the program instead of ProgramData' }
          $j = Start-Job { Restart-Service Docveta }
          if (-not (Wait-Job $j -Timeout 180)) { Fail 'restarting the service hung' }
          if (-not (WaitFor http://localhost:8080/api/v1/openapi.yaml '')) { Fail 'Docveta did not come back after a restart' }
          $u = Start-Process "$env:ProgramFiles\Docveta\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru
          if (-not $u.WaitForExit(180000)) { Fail 'uninstalling hung' }
          Start-Sleep 5
          if (Get-Process postgres -ErrorAction SilentlyContinue | Where-Object { $_.Path -like 'C:\ProgramData\Docveta\*' }) { Fail 'PostgreSQL is still running after uninstalling' }
