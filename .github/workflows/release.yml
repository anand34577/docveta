# Builds every Docveta download on each push to main (so packaging problems show up
# early), and publishes a release when a v* tag is pushed. Running it by hand from the
# Actions tab publishes a draft release for testing.
#
# Downloads it produces:
#   docveta-<ver>-<os>-<arch>.zip|tar.gz   the server: one binary with the web app inside
#   docveta-ocr-<ver>-<os>-<arch>.zip      the OCR engine (GPU/NPU/CPU), unzip next to docveta
#   docveta-setup-<ver>-windows-<arch>.exe Windows installer (service, OCR included on x64/arm64)
#   docveta-ocr-models-<ver>.zip           the OCR models alone (Docker image, custom setups)
#   SHA256SUMS
# plus Docker images on ghcr.io.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/wiki/**", "**.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a draft release (e.g. 0.2.0-rc1)"
        required: true

permissions:
  contents: write # GitHub release
  packages: write # ghcr.io
  id-token: write # provenance attestations

env:
  # Tag name for releases, the given version for manual runs, a dev number otherwise.
  VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('0.0.0-dev.{0}', github.run_number) }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: webui
          path: internal/webui/dist

  # One pure-Go build per platform: no C compiler, no runtime dependencies.
  server:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          set -eu
          V="${VERSION#v}"
          mkdir -p dist
          for target in linux/amd64/x64 linux/arm64/arm64 linux/arm/armv7 linux/386/x86 \
                        windows/amd64/x64 windows/arm64/arm64 windows/386/x86 \
                        darwin/amd64/x64 darwin/arm64/arm64; do
            os=${target%%/*}; rest=${target#*/}; arch=${rest%%/*}; label=${rest#*/}
            name="docveta-$V-$os-$label"
            out="build/$name"
            mkdir -p "$out"
            exe=docveta; [ "$os" = windows ] && exe=docveta.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X main.version=$V" -o "$out/$exe" ./cmd/docveta
            cp LICENSE "$out/"
            case $os in
              windows) cp deploy/windows/README.txt "$out/README.txt" ;;
              linux)   cp deploy/linux/install.sh deploy/linux/docveta.service "$out/"; cp docs/install-unix.txt "$out/README.txt" ;;
              darwin)  cp deploy/macos/install.sh "$out/"; cp docs/install-unix.txt "$out/README.txt" ;;
            esac
            [ -f "$out/install.sh" ] && chmod 755 "$out/install.sh"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
            echo "built $name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/*
      - uses: actions/upload-artifact@v7 # unpacked Windows builds for the installer job
        with:
          name: server-windows
          path: build/docveta-*-windows-*

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Convert PaddleOCR models to ONNX
        run: |
          pip install paddlepaddle "paddle2onnx==1.3.1" onnx
          python workers/onnx/convert.py --scripts en devanagari ta te ka --out models
      - name: Fonts for searchable PDFs (Noto, SIL Open Font License)
        run: |
          mkdir -p fonts
          base=https://github.com/notofonts/notofonts.github.io/raw/main/fonts
          for f in NotoSans/hinted/ttf/NotoSans-Regular.ttf NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Regular.ttf \
                   NotoSansTamil/hinted/ttf/NotoSansTamil-Regular.ttf NotoSansTelugu/hinted/ttf/NotoSansTelugu-Regular.ttf \
                   NotoSansKannada/hinted/ttf/NotoSansKannada-Regular.ttf; do
            curl -fsSL -o "fonts/$(basename "$f")" "$base/$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: models
          path: models
      - uses: actions/upload-artifact@v7
        with:
          name: fonts
          path: fonts

  # The OCR engine, frozen with PyInstaller so users don't need Python.
  ocr:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, label: windows-x64, ort: onnxruntime-directml } # any DirectX 12 GPU
          - { runner: ubuntu-22.04, label: linux-x64, ort: onnxruntime } # CPU (+ see wiki for CUDA)
          - { runner: ubuntu-22.04-arm, label: linux-arm64, ort: onnxruntime }
          - { runner: macos-14, label: darwin-arm64, ort: onnxruntime } # Core ML: Apple GPU / Neural Engine
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: models
          path: workers/onnx/models
      - uses: actions/download-artifact@v8
        with:
          name: fonts
          path: fonts
      - name: Build
        shell: bash
        working-directory: workers/onnx
        run: |
          set -eu
          pip install "../sdk-python[heic,ppocr]" "${{ matrix.ort }}" pyinstaller
          python -m unittest test_onnx
          pyinstaller --noconfirm docveta-ocr.spec
          cp -r models dist/docveta-ocr/models
          cp -r ../../fonts dist/docveta-ocr/fonts
          exe=dist/docveta-ocr/docveta-ocr; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --list-devices
          "$exe" --self-test --device cpu
      - name: Package
        shell: bash
        working-directory: workers/onnx/dist
        run: |
          V="${VERSION#v}"
          mv docveta-ocr ocr
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip -mx=7 "docveta-ocr-$V-${{ matrix.label }}.zip" ocr >/dev/null
          else
            zip -qry "docveta-ocr-$V-${{ matrix.label }}.zip" ocr
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ocr-${{ matrix.label }}
          path: workers/onnx/dist/*.zip

  installer:
    needs: [server, ocr]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server-windows
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: ocr-windows-x64
          path: ocr
      - name: Build installers
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = "$env:VERSION".TrimStart("v")
          $ocrZip = Get-ChildItem ocr\*.zip | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "x64", "arm64", "x86") {
            $src = "build\docveta-$v-windows-$arch"
            # x64 OCR also runs on Windows 11 on ARM (x64 emulation); 32-bit Windows has no ONNX Runtime GPU build.
            if ($arch -ne "x86") { Expand-Archive $ocrZip.FullName -DestinationPath $src -Force }
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DArch=$arch" "/DSourceDir=$PWD\$src" "/DOutputDir=$PWD\dist" deploy\windows\docveta.iss
            if ($LASTEXITCODE -ne 0) { throw "installer for $arch failed" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: dist/*.exe

  publish:
    needs: [server, ocr, installer, models]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          set -eu
          V="${VERSION#v}"
          mkdir -p dist
          cp artifacts/server/* artifacts/installers/* dist/
          cp artifacts/ocr-*/*.zip dist/
          (cd artifacts/models && zip -qr "../../dist/docveta-ocr-models-$V.zip" .)
          cd dist && sha256sum * > SHA256SUMS && ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "v$V" dist/* --draft --prerelease --title "Docveta $V (draft)" --notes-file .github/release-notes.md --target "${{ github.sha }}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Docveta $V" --notes-file .github/release-notes.md --verify-tag
          fi

  images:
    needs: models
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { name: docveta, context: ., file: Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { name: docveta-ocr, context: workers, file: workers/onnx/Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { name: docveta-worker-tesseract, context: workers, file: workers/tesseract/Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { name: docveta-worker-rknn, context: workers, file: workers/rknn/Dockerfile, platforms: "linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: models
          path: workers/onnx/models
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
